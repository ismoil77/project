name: "👕 Добавить / изменить вещь"
description: "Новая вещь или изменения к существующей: фото, состояние, дефекты, дата покупки. Фон с фото удаляется автоматически."
title: "Вещь: "
labels: ["new-item"]
body:
  - type: markdown
    attributes:
      value: |
        **Обязательно только фото** (для новой вещи). Остальное — что знаешь, можно потом дописать.
        Совет: снимай вещь целиком на ровном фоне (кровать, пол, дверь), бирку — отдельным фото.
  - type: input
    id: existing
    attributes:
      label: "ID существующей вещи"
      description: "Пусто — новая вещь. Чтобы изменить вещь, укажи её id с сайта (например top-002) и заполни только то, что меняется."
  - type: textarea
    id: photos
    attributes:
      label: "Фото"
      description: "Прикрепи одно или несколько фото («Paste, drop, or click to add files»)."
  - type: input
    id: name
    attributes:
      label: "Название"
      placeholder: "Куртка демисезонная"
  - type: dropdown
    id: category
    attributes:
      label: "Категория"
      options: ["Верх", "Низ", "Верхняя одежда", "Обувь", "Аксессуары"]
  - type: input
    id: type
    attributes:
      label: "Тип"
      placeholder: "футболка / джинсы / худи / кроссовки / туфли / ботинки / ремень"
  - type: dropdown
    id: season
    attributes:
      label: "Сезон и плотность"
      options:
        - "Лето — тонкая (футболка, шорты, лёгкая рубашка)"
        - "Межсезонье — лёгкая (рубашка, тонкий свитер, спортивка)"
        - "Межсезонье — средняя (худи, плотный свитер, джинсы)"
        - "Межсезонье — тёплая (демисезонная куртка)"
        - "Зима — очень тёплая (пуховик, зимние ботинки)"
  - type: dropdown
    id: formality
    attributes:
      label: "Стиль"
      options:
        - "1 — спорт (спортивка, беговые кроссовки)"
        - "2 — повседневный (футболка, худи, джинсы, кеды)"
        - "3 — смарт-кэжуал (рубашка, чиносы, свитер, лоферы, кожаные кроссовки)"
        - "4 — деловой (брюки, пиджак, туфли)"
        - "5 — строгий / торжество (костюм, классические туфли)"
  - type: input
    id: purchased
    attributes:
      label: "Когда купил (примерно)"
      placeholder: "осень 2024 / март 2025 / 2 года назад / недавно"
  - type: dropdown
    id: condition
    attributes:
      label: "Состояние"
      options:
        - "Отличное — как новая"
        - "Хорошее — есть следы носки"
        - "Есть дефекты — видно вблизи"
        - "Только для дома / спорта"
  - type: checkboxes
    id: flaws
    attributes:
      label: "Дефекты"
      options:
        - label: "Выцвел цвет"
        - label: "Пятно"
        - label: "Катышки"
        - label: "Дырка / зацепка"
        - label: "Растянулась / села"
        - label: "Сломана молния / пуговица"
  - type: textarea
    id: flaw_notes
    attributes:
      label: "Подробнее о дефектах"
      placeholder: "Пятно на левом рукаве, видно только вблизи"
  - type: checkboxes
    id: occasions
    attributes:
      label: "Где можно носить"
      description: "Ничего не отмечено — везде, кроме того, что запрещает состояние."
      options:
        - label: "Работа"
        - label: "Повседневно"
        - label: "Спорт"
        - label: "Дом"
        - label: "Праздник / выход"
  - type: input
    id: brand
    attributes:
      label: "Бренд"
  - type: input
    id: color
    attributes:
      label: "Цвет"
      placeholder: "тёмно-синий"
      description: "Можно не писать — цвет определится по фото автоматически."
  - type: dropdown
    id: pattern
    attributes:
      label: "Узор"
      options: ["Однотонный", "Полоска", "Клетка", "Принт / надпись", "Камуфляж", "Другой"]
  - type: input
    id: material
    attributes:
      label: "Состав"
      placeholder: "100% хлопок"
  - type: input
    id: size
    attributes:
      label: "Размер"
      placeholder: "48 / M / W31 L32 / 40"
  - type: input
    id: insole
    attributes:
      label: "Длина стельки, см (для обуви)"
      placeholder: "26,5"
  - type: dropdown
    id: sheer
    attributes:
      label: "Просвечивает"
      description: "Подними вещь к лампе или окну."
      options: ["Нет", "Немного, на свету", "Сильно — видно силуэт"]
  - type: checkboxes
    id: protection
    attributes:
      label: "Защита от погоды"
      options:
        - label: "Держит ветер"
        - label: "Непромокаемая"
  - type: input
    id: price
    attributes:
      label: "Цена"
      placeholder: "2500 ₽"
  - type: input
    id: link
    attributes:
      label: "Ссылка на товар"
  - type: textarea
    id: notes
    attributes:
      label: "Заметки"
  - type: dropdown
    id: removebg
    attributes:
      label: "Удалить фон"
      options: ["Не удалять", "На всех фото", "Только на первом (обложка)"]
      default: 0
