name: Wardrobe update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: wardrobe-write
  cancel-in-progress: false

jobs:
  add:
    # Only the repository owner may add items (the repo is public).
    if: >-
      (contains(github.event.issue.labels.*.name, 'new-item') || contains(github.event.issue.labels.*.name, 'archive-item'))
      && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-isnet-general-use-v1

      - run: pip install -r scripts/requirements.txt

      - name: Process photos
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_FILE: ${{ runner.temp }}/result.md
          FORM: ${{ contains(github.event.issue.labels.*.name, 'archive-item') && 'archive' || 'add' }}
        run: python scripts/add_item.py

      - name: Commit
        run: |
          git config user.name "wardrobe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wardrobe
          git commit -m "Wardrobe update from issue #${{ github.event.issue.number }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Reply and close
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "${{ runner.temp }}/result.md"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "Не получилось добавить вещь 😕 Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
